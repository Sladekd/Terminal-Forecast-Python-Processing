name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  test:
    name: py${{ matrix.python }} ${{ matrix.os }} ${{ matrix.pandas || 'pandas latest' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # oldest supported dependency versions
          - os: ubuntu-latest
            python: "3.9"
            pandas: "pandas==1.4.4 numpy<1.24"
          - os: ubuntu-latest
            python: "3.11"
            pandas: "pandas==2.0.3 numpy<2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        shell: bash
        env:
          PINS: ${{ matrix.pandas }}
        run: |
          python -m pip install --upgrade pip
          pip install ".[plot,test]" $PINS
      - name: Test installed package
        run: pytest --cov=taf_decoder --cov-report=term
        env:
          MPLBACKEND: Agg

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/taf-decoder "TAF LKTB 030500Z 0306/0406 17007KT 9999 SCT025=" --reference-time 2023-08-03 --format csv
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
